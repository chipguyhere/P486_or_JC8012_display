name=chipguy_P486_or_JC8012_display
version=1.0.0
author=chipguyhere
maintainer=chipguyhere
sentence=One LVGL display + touch driver for two ESP32-P4 panels, the Guition JC8012P4A1C and the Waveshare P486 Panel, chosen at boot
paragraph=Builds one firmware image that runs on either the Guition JC8012P4A1C (800x1280 JD9365 MIPI-DSI panel, GSL3680 touch) or the Waveshare ESP32-P4-86-Panel-ETH-2RO (720x720 ST7703 panel, GT911 touch, Ethernet). At boot it works out which board it is on (I2C devices, then flash size, remembered in NVS), and brings up the panel with the rotation and resolution the sketch asked for on that board: native, or a 480-wide canvas the ESP32-P4 PPA scales up in hardware. The resulting resolution is reported to LVGL. Also lets chipguy_MQTT_netclient's P486 Ethernet header fall back to Wi-Fi on the JC8012. Ships LVGL 9 examples. Requires PSRAM and Flash Size 16MB.
category=Display
